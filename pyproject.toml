[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rehearse-ai"
version = "0.1.0"
description = "RehearseAI local voice mock-interview coach"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[deepgram,openai,runner,webrtc]==1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rehearse_ai = ["prompts/*.txt", "web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
